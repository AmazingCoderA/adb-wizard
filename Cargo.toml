[package]
name = "adb-wizard"
version = "0.2.0"
edition = "2021"
description = "Монитор Android-устройства через ADB: нагрузка, приложения, экран, трансляция и консоль"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
webbrowser = "1.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
